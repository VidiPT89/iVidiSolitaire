name: iVidiSolitaire
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: S769436W24
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  iVidiSolitaire:
    type: application
    platform: iOS
    sources:
      - path: iVidiSolitaire/Sources
    info:
      path: iVidiSolitaire/Sources/Info.plist
      properties:
        CFBundleDisplayName: iVidiSolitaire
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.iSolitaire
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iVidiSolitaire/iVidiSolitaire.entitlements
    scheme:
      testTargets:
        - iVidiSolitaireTests

  iVidiSolitaireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iVidiSolitaireTests
    dependencies:
      - target: iVidiSolitaire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.iVidiSolitaireTests
        GENERATE_INFOPLIST_FILE: YES
